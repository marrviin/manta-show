name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build & pack only, do not publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match packages/mcp version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/mcp
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/mcp
        run: pnpm build

      - name: Pack (dry run)
        if: inputs.dry_run == true
        working-directory: packages/mcp
        run: pnpm pack

      - name: Publish
        if: inputs.dry_run != true
        working-directory: packages/mcp
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm publish --no-git-checks --access public
