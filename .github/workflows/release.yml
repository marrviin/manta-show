name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build & pack only, do not publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write # for npm provenance

env:
  NODE_VERSION: '22'

jobs:
  # Build node-pty for every supported platform and publish each prebuilt
  # binary as its own npm package (@manta-show/node-pty-<platform>-<arch>).
  # The fork's install script prefers these and skips the local node-gyp build.
  # Note: a package's FIRST version cannot be published via OIDC — until each
  # platform package has been published once manually, this job fails; the
  # packed tarballs are uploaded as artifacts for that one-time bootstrap.
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin, arch: arm64, os: macos-latest }
          - { platform: darwin, arch: x64, os: macos-latest }
          - { platform: linux, arch: x64, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm }
          - { platform: win32, arch: x64, os: windows-latest }
    name: build-native (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm (OIDC publish needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Build native bindings
        working-directory: packages/node-pty
        run: |
          npm install --ignore-scripts --no-package-lock --no-save node-gyp@latest
          npx node-gyp rebuild --arch=${{ matrix.arch }}

      - name: Assemble platform package
        working-directory: packages/node-pty
        run: node scripts/pack-platform.js --out out --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-pty-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/node-pty/out/@manta-show/*/*.tgz
          if-no-files-found: error

      - name: Publish platform package
        if: inputs.dry_run != true
        working-directory: packages/node-pty/out/@manta-show/node-pty-${{ matrix.platform }}-${{ matrix.arch }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${NAME}@${VERSION} — skipping"
          else
            npm publish --tag beta --access public
          fi

  publish-fork:
    runs-on: ubuntu-latest
    # Independent of build-native: the fork tarball is platform-independent, and
    # a missing optional dep is skipped gracefully by installers.
    if: inputs.dry_run != true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'

      - name: Publish fork
        working-directory: packages/node-pty
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@manta-show/node-pty@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published: @manta-show/node-pty@${VERSION} — skipping"
          else
            pnpm publish --no-git-checks --access public --tag beta
          fi

  publish:
    runs-on: ubuntu-latest
    needs: [publish-fork]
    if: ${{ !cancelled() && needs.publish-fork.result == 'success' && inputs.dry_run != true }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match packages/mcp version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/mcp
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/mcp
        run: pnpm build

      - name: Pack (dry run)
        if: inputs.dry_run == true
        working-directory: packages/mcp
        run: pnpm pack

      - name: Publish
        if: inputs.dry_run != true
        working-directory: packages/mcp
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@manta-show/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published: @manta-show/mcp@${VERSION} — skipping"
          else
            pnpm publish --no-git-checks --access public
          fi
