packages:
  - 'packages/*'

# Only these dependencies are allowed to run install/postinstall build scripts
allowBuilds:
  electron: true
  esbuild: true
  ffmpeg-static: true
  "@manta-show/node-pty": true

minimumReleaseAgeExclude:
  - '@manta-show/node-pty@1.1.0-beta34.1 || 1.1.0-beta34.3'
  - '@manta-show/node-pty-darwin-arm64@1.1.0-beta34.2 || 1.1.0-beta34.3'
  - '@manta-show/node-pty-darwin-x64@1.1.0-beta34.2 || 1.1.0-beta34.3'
  - '@manta-show/node-pty-linux-arm64@1.1.0-beta34.3'
  - '@manta-show/node-pty-linux-x64@1.1.0-beta34.3'
  - '@manta-show/node-pty-win32-x64@1.1.0-beta34.3'

onlyBuiltDependencies:
  - electron
  - "@manta-show/node-pty"
  - playwright
  - esbuild
  - ffmpeg-static
