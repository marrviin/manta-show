packages:
  - 'packages/*'

# Only these dependencies are allowed to run install/postinstall build scripts
allowBuilds:
  electron: true
  esbuild: true
  ffmpeg-static: true
  "@manta-show/node-pty": true

minimumReleaseAgeExclude:
  - '@manta-show/node-pty@1.1.0-beta34.1'

onlyBuiltDependencies:
  - electron
  - "@manta-show/node-pty"
  - playwright
  - esbuild
  - ffmpeg-static
